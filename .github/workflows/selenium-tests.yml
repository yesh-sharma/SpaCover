name: Selenium Test Automation

# When to run the tests
on:
  push:
    branches: [main, master] # Run on push to main/master
  pull_request:
    branches: [main, master] # Run on pull requests
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  test:
    runs-on: ubuntu-latest # Use Ubuntu Linux environment

    steps:
      # Step 1: Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17" # Change this to your Java version
          distribution: "temurin"
          cache: "maven" # Cache Maven dependencies for faster builds

      # Step 3: Setup Chrome Browser
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      # Step 4: Run tests
      - name: Run Selenium Tests
        run: mvn clean test

      # Step 5: Upload test reports (if tests fail or pass)
      - name: Upload Test Reports
        if: always() # Run even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
